<script>
if (!window.storage) {
  window.storage = {
    async get(key){ try { const v = localStorage.getItem(key); return v !== null ? { key, value: v } : null; } catch(e){ return null; } },
    async set(key, value){ try { localStorage.setItem(key, value); return { key, value }; } catch(e){ return null; } },
    async delete(key){ try { localStorage.removeItem(key); return { key, deleted: true }; } catch(e){ return null; } },
    async list(prefix){ try { const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix)); return { keys }; } catch(e){ return null; } }
  };
}
</script>

    "turn on":{py:"dǎkāi",zh:"打开"},
    "turn off":{py:"guāndiào",zh:"关掉"},
    "deal with":{py:"chǔlǐ",zh:"处理"},
    "of course":{py:"dāngrán",zh:"当然"},
    "by the way":{py:"shùnbiàn shuō",zh:"顺便说"},
    "in fact":{py:"qíshí",zh:"其实"},
    "at least":{py:"zhìshǎo",zh:"至少"}
  };

  const STORAGE_KEY_PROGRESS = "zh-reader-progress";
  const STORAGE_KEY_CUSTOM_WORDS = "zh-reader-custom-words";
  const STORAGE_KEY_CUSTOM_PHRASES = "zh-reader-custom-phrases";
  const MASTERY_THRESHOLD = 5;
  const DAY = 24 * 60 * 60 * 1000;

  // spaced-repetition-ish intervals: how long a word can go unseen before it's "due"
  function dueInterval(count){
    if (count <= 0) return 0;
    if (count === 1) return 1 * DAY;
    if (count === 2) return 2 * DAY;
    if (count === 3) return 4 * DAY;
    if (count === 4) return 7 * DAY;
    return 14 * DAY; // mastered
  }

  let progress = { exposures: {}, sessions: 0, level: 1 };
  let customWords = {};
  let customPhrases = {};
  let zhVoice = null;
  let reviewQueue = [];
  let reviewIndex = 0;
  let reviewRevealed = false;
  let reviewDone = 0;

  function pickVoice(){
    if (!window.speechSynthesis) return;
    const voices = speechSynthesis.getVoices();
    zhVoice = voices.find(v => v.lang === "zh-CN") || voices.find(v => v.lang && v.lang.startsWith("zh")) || null;
  }
  if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function speakZh(text){
    if (!window.speechSynthesis || !text) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-CN"; if (zhVoice) u.voice = zhVoice; u.rate = 0.82;
    speechSynthesis.speak(u);
  }

  function getCount(key){
    const e = progress.exposures[key];
    if (!e) return 0;
    return typeof e === "number" ? e : (e.count || 0);
  }
  function getVerified(key){
    const e = progress.exposures[key];
    if (!e || typeof e === "number") return 0;
    return e.verified || 0;
  }
  function getLastSeen(key){
    const e = progress.exposures[key];
    if (!e || typeof e === "number") return null;
    return e.lastSeen || null;
  }
  function setExposure(key, count, verified, lastSeen){
    progress.exposures[key] = { count, verified, lastSeen };
  }

  const root = document.getElementById("zh-dash-root");
  root.innerHTML = `
    <div class="zd-header">
      <div>
        <div class="zd-title">Reading Bridge <span class="accent">进度</span></div>
        <div class="zd-sub zd-sans">Прогресс и повторение по всем словам и фразам из Reading Bridge</div>
      </div>
      <div class="zd-stats zd-sans">
        <div class="zd-stat"><div class="zd-stat-num" id="zd-total">0</div><div class="zd-stat-label">В словаре</div></div>
        <div class="zd-stat"><div class="zd-stat-num" id="zd-mastered">0</div><div class="zd-stat-label">Освоено</div></div>
        <div class="zd-stat"><div class="zd-stat-num due" id="zd-due">0</div><div class="zd-stat-label">Пора повторить</div></div>
      </div>
    </div>

    <div class="zd-panel" id="zd-review-cta-panel">
      <div class="zd-review-cta zd-sans">
        <p id="zd-review-cta-text">Загрузка…</p>
        <div style="display:flex; gap:10px;">
          <button class="zd-btn secondary zd-sans" id="zd-export-village">Экспорт для деревни</button>
          <button class="zd-btn" id="zd-start-review">Начать повторение</button>
        </div>
      </div>
      <textarea id="zd-village-output" readonly class="zd-sans" style="display:none; width:100%; min-height:60px; font-family:monospace; font-size:11px; padding:8px; margin-top:10px; border:1px solid var(--line); border-radius:6px; background:#fffdf9;"></textarea>
    </div>

    <div class="zd-panel" id="zd-review-panel" style="display:none;"></div>

    <div class="zd-panel">
      <input type="text" class="zd-search zd-sans" id="zd-search" placeholder="Поиск по слову, pinyin или переводу..." />
      <table class="zd-table zd-sans">
        <thead>
          <tr>
            <th data-sort="en">Слово / фраза</th>
            <th data-sort="py">Pinyin</th>
            <th data-sort="type">Тип</th>
            <th data-sort="count">Показов</th>
            <th data-sort="verified">Подтверждено</th>
            <th data-sort="last">Последний раз</th>
            <th data-sort="status">Статус</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="zd-table-body"></tbody>
      </table>
      <div class="zd-empty" id="zd-empty" style="display:none;">Пока пусто — почитай что-нибудь через Reading Bridge, и слова появятся тут.</div>
    </div>
  `;

  const $ = (sel) => root.querySelector(sel);

  function allEntries(){
    const wd = Object.assign({}, BUILTIN_WORDS, customWords);
    const pd = Object.assign({}, BUILTIN_PHRASES, customPhrases);
    const list = [];
    Object.keys(wd).forEach(en => list.push({ en, type: "word", entry: wd[en] }));
    Object.keys(pd).forEach(en => list.push({ en, type: "phrase", entry: pd[en] }));
    return list;
  }

  function isDue(en){
    const count = getCount(en);
    if (count <= 0) return false; // never seen at all — not "forgotten", just new
    const verified = getVerified(en);
    if (verified === 0) return true; // seen passively but never actually tested — due for first real check
    const lastSeen = getLastSeen(en);
    if (!lastSeen) return true; // legacy data with no timestamp — treat as due, establish a baseline
    return (Date.now() - lastSeen) > dueInterval(verified);
  }

  let sortKey = "last";
  let sortDir = 1;

  function statusOf(en){
    const count = getCount(en);
    if (count === 0) return "new";
    if (isDue(en)) return "due";
    if (getVerified(en) >= MASTERY_THRESHOLD) return "mastered";
    return "learning";
  }

  function renderAll(){
    const entries = allEntries();
    const total = entries.length;
    const mastered = entries.filter(e => getVerified(e.en) >= MASTERY_THRESHOLD).length;
    const due = entries.filter(e => isDue(e.en));

    $("#zd-total").textContent = total;
    $("#zd-mastered").textContent = mastered;
    $("#zd-due").textContent = due.length;

    if (due.length === 0) {
      $("#zd-review-cta-text").textContent = "Всё свежо — повторять пока нечего. Почитай что-нибудь новое в Reading Bridge.";
      $("#zd-start-review").disabled = true;
    } else {
      $("#zd-review-cta-text").textContent = `${due.length} слов/фраз просят повторения — то, что ты видел, но давно не встречал.`;
      $("#zd-start-review").disabled = false;
    }

    renderTable(entries);
  }

  function renderTable(entries){
    const search = $("#zd-search").value.trim().toLowerCase();
    let filtered = entries.filter(e => {
      if (!search) return true;
      return e.en.includes(search) || e.entry.py.toLowerCase().includes(search) || (e.entry.zh || "").includes(search);
    });

    filtered.sort((a, b) => {
      let av, bv;
      if (sortKey === "en") { av = a.en; bv = b.en; }
      else if (sortKey === "py") { av = a.entry.py; bv = b.entry.py; }
      else if (sortKey === "type") { av = a.type; bv = b.type; }
      else if (sortKey === "count") { av = getCount(a.en); bv = getCount(b.en); }
      else if (sortKey === "verified") { av = getVerified(a.en); bv = getVerified(b.en); }
      else if (sortKey === "last") { av = getLastSeen(a.en) || 0; bv = getLastSeen(b.en) || 0; }
      else if (sortKey === "status") { av = statusOf(a.en); bv = statusOf(b.en); }
      if (av < bv) return -1 * sortDir;
      if (av > bv) return 1 * sortDir;
      return 0;
    });

    $("#zd-empty").style.display = filtered.length ? "none" : "block";

    $("#zd-table-body").innerHTML = filtered.map(e => {
      const count = getCount(e.en);
      const verified = getVerified(e.en);
      const lastSeen = getLastSeen(e.en);
      const status = statusOf(e.en);
      const lastSeenText = lastSeen ? formatRelative(lastSeen) : (count > 0 ? "давно (нет даты)" : "—");
      let badge = "";
      if (status === "due") badge = `<span class="zd-badge due">пора повторить</span>`;
      else if (status === "mastered") badge = `<span class="zd-badge mastered">освоено</span>`;
      else if (status === "learning") badge = `<span class="zd-badge">учится</span>`;
      else badge = `<span class="zd-badge" style="opacity:0.5;">новое</span>`;
      return `<tr class="${status === 'due' ? 'due-row' : ''}">
        <td>${e.en}</td>
        <td>${e.entry.py}</td>
        <td><span class="zd-badge ${e.type === 'phrase' ? 'phrase' : ''}">${e.type === 'phrase' ? 'фраза' : 'слово'}</span></td>
        <td>${count}</td>
        <td>${verified}/${MASTERY_THRESHOLD}</td>
        <td>${lastSeenText}</td>
        <td>${badge}</td>
        <td><button class="zd-mini-audio" data-speak="${e.entry.zh || e.entry.py}" aria-label="Озвучить ${e.en}">🔊</button></td>
      </tr>`;
    }).join("");

    $("#zd-table-body").querySelectorAll("[data-speak]").forEach(btn => {
      btn.addEventListener("click", () => speakZh(btn.dataset.speak));
    });
  }

  function formatRelative(ts){
    const diffMs = Date.now() - ts;
    const days = Math.floor(diffMs / DAY);
    if (days <= 0) return "сегодня";
    if (days === 1) return "вчера";
    if (days < 7) return days + " дн. назад";
    const weeks = Math.floor(days / 7);
    if (weeks < 5) return weeks + " нед. назад";
    return Math.floor(days / 30) + " мес. назад";
  }

  // ---- review card mode ----
  function startReview(){
    const entries = allEntries().filter(e => isDue(e.en));
    // most overdue first
    entries.sort((a, b) => (getLastSeen(a.en) || 0) - (getLastSeen(b.en) || 0));
    reviewQueue = entries;
    reviewIndex = 0;
    reviewDone = 0;
    reviewRevealed = false;
    $("#zd-review-cta-panel").style.display = "none";
    $("#zd-review-panel").style.display = "block";
    renderReviewCard();
  }

  function renderReviewCard(){
    const panel = $("#zd-review-panel");
    if (reviewIndex >= reviewQueue.length) {
      panel.innerHTML = `
        <div class="zd-review-wrap">
          <div style="font-size:20px; color:var(--jade-deep); margin-bottom:8px;">Готово 🎉</div>
          <div class="zd-sans" style="color:var(--ink-soft); margin-bottom:18px;">Повторил ${reviewDone} из ${reviewQueue.length}.</div>
          <button class="zd-btn secondary zd-sans" id="zd-finish-review">Вернуться к дашборду</button>
        </div>`;
      $("#zd-finish-review").addEventListener("click", async () => {
        $("#zd-review-panel").style.display = "none";
        $("#zd-review-cta-panel").style.display = "block";
        await saveProgress();
        renderAll();
      });
      return;
    }

    const item = reviewQueue[reviewIndex];
    reviewRevealed = false;

    // build honest multiple-choice test instead of self-reported remember/forgot
    const pool = allEntries().filter(e => e.en !== item.en);
    const distractors = [];
    while (distractors.length < 3 && distractors.length < pool.length) {
      const cand = pool[Math.floor(Math.random() * pool.length)];
      if (!distractors.find(d => d.en === cand.en)) distractors.push(cand);
    }
    const options = [item, ...distractors].sort(() => Math.random() - 0.5);

    panel.innerHTML = `
      <div class="zd-review-wrap">
        <div class="zd-review-progress zd-sans">${reviewIndex + 1} / ${reviewQueue.length}</div>
        <div class="zd-card">
          <div class="zd-card-py ${item.type === 'phrase' ? 'zd-phrase-py' : ''}">${item.entry.py}</div>
          <button class="zd-card-audio" id="zd-card-audio-btn">🔊 Произнести</button>
          <div class="zd-sans" style="font-size:12px; color:var(--ink-soft); margin-bottom:10px;">Что это значит?</div>
          <div class="zd-mc-options" id="zd-mc-options" style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
            ${options.map(o => `<button class="zd-btn secondary zd-sans zd-mc-btn" data-en="${o.en}" style="padding:10px 8px;">${o.en}</button>`).join("")}
          </div>
          <div class="zd-card-en zd-sans" id="zd-feedback" style="margin-top:14px;"></div>
        </div>
        <div style="margin-top:6px;"><button class="zd-btn ghost zd-sans" id="zd-skip-btn">Пропустить сессию</button></div>
      </div>
    `;

    $("#zd-card-audio-btn").addEventListener("click", () => speakZh(item.entry.zh || item.entry.py));
    speakZh(item.entry.zh || item.entry.py);

    panel.querySelectorAll(".zd-mc-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        panel.querySelectorAll(".zd-mc-btn").forEach(b => b.disabled = true);
        const picked = btn.dataset.en;
        const isCorrect = picked === item.en;
        const cur = getCount(item.en);
        const curVerified = getVerified(item.en);
        if (isCorrect) {
          setExposure(item.en, cur + 1, curVerified + 1, Date.now());
          reviewDone++;
          btn.style.background = "var(--jade-deep)"; btn.style.color = "var(--paper)";
        } else {
          setExposure(item.en, cur + 1, Math.max(0, Math.floor(curVerified / 2)), Date.now());
          btn.style.background = "var(--rust)"; btn.style.color = "var(--paper)";
          const correctBtn = panel.querySelector(`.zd-mc-btn[data-en="${item.en}"]`);
          if (correctBtn) { correctBtn.style.background = "var(--jade-deep)"; correctBtn.style.color = "var(--paper)"; }
        }
        const fb = document.getElementById("zd-feedback");
        fb.innerHTML = `<div style="margin-bottom:8px;">${isCorrect ? "Верно!" : "Не совсем — правильный ответ выделен."}</div><button class="zd-btn zd-sans" id="zd-next-card-btn">Дальше →</button>`;
        document.getElementById("zd-next-card-btn").addEventListener("click", () => {
          reviewIndex++;
          renderReviewCard();
        });
      });
    });
    $("#zd-skip-btn").addEventListener("click", async () => {
      $("#zd-review-panel").style.display = "none";
      $("#zd-review-cta-panel").style.display = "block";
      await saveProgress();
      renderAll();
    });
  }

  async function saveProgress(){
    try { await window.storage.set(STORAGE_KEY_PROGRESS, JSON.stringify(progress)); }
    catch(e) { console.error("Storage error", e); }
  }

  async function loadState(){
    try {
      const p = await window.storage.get(STORAGE_KEY_PROGRESS);
      if (p && p.value) progress = JSON.parse(p.value);
    } catch(e) {}
    try {
      const c = await window.storage.get(STORAGE_KEY_CUSTOM_WORDS);
      if (c && c.value) customWords = JSON.parse(c.value);
    } catch(e) {}
    try {
      const ph = await window.storage.get(STORAGE_KEY_CUSTOM_PHRASES);
      if (ph && ph.value) customPhrases = JSON.parse(ph.value);
    } catch(e) {}
    renderAll();
  }

  $("#zd-start-review").addEventListener("click", startReview);
  $("#zd-export-village").addEventListener("click", () => {
    const entries = allEntries();
    const mastered = entries.filter(e => getVerified(e.en) >= MASTERY_THRESHOLD).length;
    const payload = { mastered, sessions: progress.sessions, exportedAt: Date.now() };
    const box = $("#zd-village-output");
    box.value = JSON.stringify(payload);
    box.style.display = box.style.display === "none" ? "block" : "none";
    if (box.style.display === "block") { box.select(); }
  });
  $("#zd-search").addEventListener("input", () => renderTable(allEntries()));
  root.querySelectorAll("[data-sort]").forEach(th => {
    th.addEventListener("click", () => {
      const key = th.dataset.sort;
      if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = 1; }
      renderTable(allEntries());
    });
  });

  loadState();
})();
</script>
