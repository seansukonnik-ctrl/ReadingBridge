<script>
if (!window.storage) {
  window.storage = {
    async get(key){ try { const v = localStorage.getItem(key); return v !== null ? { key, value: v } : null; } catch(e){ return null; } },
    async set(key, value){ try { localStorage.setItem(key, value); return { key, value }; } catch(e){ return null; } },
    async delete(key){ try { localStorage.removeItem(key); return { key, deleted: true }; } catch(e){ return null; } },
    async list(prefix){ try { const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix)); return { keys }; } catch(e){ return null; } }
  };
}
</script>

  // diacritics: "ni3hao3" -> "nǐhǎo". Syllable boundaries are inferred from
  // the digits themselves, so each syllable must end with its tone number.
  const TONE_MARKS = {
    a: ["a","ā","á","ǎ","à"], e: ["e","ē","é","ě","è"], i: ["i","ī","í","ǐ","ì"],
    o: ["o","ō","ó","ǒ","ò"], u: ["u","ū","ú","ǔ","ù"], "ü": ["ü","ǖ","ǘ","ǚ","ǜ"]
  };
  function applyToneToSyllable(syll, tone){
    let s = syll.toLowerCase().replace(/v/g, "ü");
    if (!tone || tone === 5 || tone === 0) return s;
    let idx = -1;
    if (s.includes("a")) idx = s.indexOf("a");
    else if (s.includes("e")) idx = s.indexOf("e");
    else if (s.includes("ou")) idx = s.indexOf("o");
    else { for (let i = s.length - 1; i >= 0; i--) { if (TONE_MARKS[s[i]]) { idx = i; break; } } }
    if (idx === -1) return s;
    const vowel = s[idx];
    if (!TONE_MARKS[vowel]) return s;
    return s.slice(0, idx) + TONE_MARKS[vowel][tone] + s.slice(idx + 1);
  }

  function getCount(key){

    return e.verified || 0;
  }
  function getLastSeen(key){

    if (!e || typeof e === "number") return null;
    return e.lastSeen || null;

  async function loadState(){
    try {
      const p = await window.storage.get(STORAGE_KEY_PROGRESS);
      if (p && p.value) progress = JSON.parse(p.value);
    } catch(e) {}
    try {
      const c = await window.storage.get(STORAGE_KEY_CUSTOM_WORDS);
      if (c && c.value) customWords = JSON.parse(c.value);
    } catch(e) {}
    try {
      const ph = await window.storage.get(STORAGE_KEY_CUSTOM_PHRASES);
      if (ph && ph.value) customPhrases = JSON.parse(ph.value);
    } catch(e) {}
    try {
      const h = await window.storage.get(STORAGE_KEY_SHOW_HANZI);
      if (h && h.value) showHanzi = h.value === "true";
    } catch(e) {}
    try {
      const k = await window.storage.get(STORAGE_KEY_KNOWN_WORDS);
      if (k && k.value) knownWords = JSON.parse(k.value);
    } catch(e) {}

    $("#zr-level").value = progress.level;

    updateLevelLabel();

  async function saveProgress(){
    try { await window.storage.set(STORAGE_KEY_PROGRESS, JSON.stringify(progress)); }
    catch(e) { console.error("Storage error", e); }

    catch(e) { console.error("Storage error", e); }

  function wordDict(){ return Object.assign({}, BUILTIN_WORDS, customWords); }
  function phraseDict(){ return Object.assign({}, BUILTIN_PHRASES, customPhrases); }

  // The ACTIVE replacement pool is intentionally narrower than the full
  // catalog: only words you've explicitly added, marked "already know", or
  // that this tool has already introduced you to before (tracked in
  // progress.exposures). The rest of BUILTIN_WORDS/PHRASES is just a
  // browsable catalog — matching text against it silently would mean
  // replacing words you've never actually learned, which isn't honest.
  function activeWordDict(){
    const wd = wordDict();
    const active = {};
    Object.keys(wd).forEach(key => {
      const isCustom = customWords.hasOwnProperty(key);
      const isKnown = !!knownWords[key];
      const isEncountered = !!progress.exposures[key];
      if (isCustom || isKnown || isEncountered) active[key] = wd[key];
    });
    return active;
  }
  function activePhraseDict(){
    const pd = phraseDict();
    const active = {};
    Object.keys(pd).forEach(key => {
      const isCustom = customPhrases.hasOwnProperty(key);
      const isKnown = !!knownWords[key];
      const isEncountered = !!progress.exposures[key];
      if (isCustom || isKnown || isEncountered) active[key] = pd[key];
    });
    return active;
  }

  function masteredCount(){
    return Object.keys(progress.exposures).filter(k => getVerified(k) >= MASTERY_THRESHOLD).length;

  function updateLevelLabel(){
    const lvl = parseInt($("#zr-level").value, 10);
    $("#zr-level-val").textContent = (lvl * 10) + "% слов";
  }

  function renderWordList(){
    const wd = wordDict();
    const pd = phraseDict();
    const search = ($("#zr-catalog-search") && $("#zr-catalog-search").value.trim().toLowerCase()) || "";

    function matchesSearch(en, entry){
      if (!search) return true;
      return en.includes(search) || entry.py.toLowerCase().includes(search) || (entry.zh || "").includes(search);
    }

    const wordRows = Object.keys(wd).sort().filter(en => matchesSearch(en, wd[en])).map(en => {
      const entry = wd[en];
      const verified = getVerified(en);
      const isCustom = customWords.hasOwnProperty(en);
      const isKnown = !!knownWords[en];
      const isEncountered = !!progress.exposures[en];
      const isActive = isCustom || isKnown || isEncountered;
      const knownCell = isCustom
        ? `<span class="zr-tag">своё</span>`
        : `<label style="cursor:pointer;"><input type="checkbox" data-known-word="${en}" ${isKnown ? "checked" : ""} /> знаю</label>`;
      return `<tr style="${isActive ? '' : 'opacity:0.55;'}"><td>${en}</td><td>${entry.py}</td><td>${entry.zh || "—"}</td><td><span class="zr-tag">слово</span></td><td>${verified >= MASTERY_THRESHOLD ? "✓" : verified + "/" + MASTERY_THRESHOLD}</td><td>${knownCell}</td><td>${isCustom ? `<span class="zr-rm" data-rm-word="${en}">убрать</span>` : ""}</td></tr>`;
    }).join("");

    const phraseRows = Object.keys(pd).sort().filter(en => matchesSearch(en, pd[en])).map(en => {
      const entry = pd[en];
      const verified = getVerified(en);
      const isCustom = customPhrases.hasOwnProperty(en);
      const isKnown = !!knownWords[en];
      const isEncountered = !!progress.exposures[en];
      const isActive = isCustom || isKnown || isEncountered;
      const knownCell = isCustom
        ? `<span class="zr-tag">своё</span>`
        : `<label style="cursor:pointer;"><input type="checkbox" data-known-phrase="${en}" ${isKnown ? "checked" : ""} /> знаю</label>`;
      return `<tr style="${isActive ? '' : 'opacity:0.55;'}"><td>${en}</td><td>${entry.py}</td><td>${entry.zh || "—"}</td><td><span class="zr-tag">фраза</span></td><td>${verified >= MASTERY_THRESHOLD ? "✓" : verified + "/" + MASTERY_THRESHOLD}</td><td>${knownCell}</td><td>${isCustom ? `<span class="zr-rm" data-rm-phrase="${en}">убрать</span>` : ""}</td></tr>`;
    }).join("");

    $("#zr-word-list").innerHTML = `<table>${phraseRows}${wordRows}</table>`;

    $("#zr-word-list").querySelectorAll("[data-rm-word]").forEach(el => {
      el.addEventListener("click", async () => {
        delete customWords[el.dataset.rmWord];
        await saveCustomWords();
        renderWordList();
      });
    });
    $("#zr-word-list").querySelectorAll("[data-rm-phrase]").forEach(el => {
      el.addEventListener("click", async () => {
        delete customPhrases[el.dataset.rmPhrase];
        await saveCustomPhrases();
        renderWordList();
      });
    });
    $("#zr-word-list").querySelectorAll("[data-known-word], [data-known-phrase]").forEach(el => {
      el.addEventListener("change", async () => {
        const key = el.dataset.knownWord || el.dataset.knownPhrase;
        if (el.checked) knownWords[key] = true; else delete knownWords[key];
        await saveKnownWords();
        renderWordList();
      });
    });
  }

  function tokenizeWords(text){
    return text.split(/(\b[a-zA-Z']+\b)/);
  }

  // Splits text into phrase-matches and plain remainder chunks, longest phrase first.
  function splitByPhrases(text, pd){
    const phrases = Object.keys(pd).sort((a,b) => b.length - a.length);
    if (!phrases.length) return [{ type: "text", value: text }];
    const pattern = phrases.map(p => "\\b" + p.split(" ").map(escapeRegex).join("\\s+") + "\\b").join("|");
    const regex = new RegExp("(" + pattern + ")", "gi");
    const parts = text.split(regex);
    return parts.filter(p => p !== undefined).map(p => {
      const lower = p.toLowerCase().replace(/\s+/g, " ");
      if (pd[lower]) return { type: "phrase", value: p, key: lower };
      return { type: "text", value: p };
    });
  }

  // Word-substitution can't handle English constructions where a word's
  // meaning depends on what follows it — "one of many" isn't "yī of many".
  // These are known-bad (word, next-word) pairs: skip replacing the first
  // word specifically in these combinations, even if it's otherwise active.
  const EXCLUDE_PAIRS = new Set([
    "one|of", "some|of", "all|of", "many|of", "because|of", "out|of",
    "in|front", "in|spite", "in|terms", "in|favor", "in|case",
    "up|to", "due|to", "close|to", "next|to", "according|to",
    "right|now", "right|here", "right|away",
    "so|that", "so|far", "so|much", "so|many",
    "such|as", "as|well", "as|long"
  ]);
  function findNextWord(arr, idx){
    for (let j = idx + 1; j < arr.length; j++) {
      const t = arr[j];
      if (!t) continue;
      if (/^[a-zA-Z']+$/.test(t)) return t.toLowerCase();
      if (t.trim()) return null; // hit real punctuation/other content — stop looking
    }
    return null;
  }

  function processText(text){
    const wd = activeWordDict();
    const pd = activePhraseDict();
    const level = progress.level;
    const baseProb = level / 10;

    const segments = splitByPhrases(text, pd);

    // decide replacement for every unique matched word/phrase up front, for consistency
    const decisions = {};
    const seenKeys = new Set();
    segments.forEach(seg => {
      if (seg.type === "phrase") { seenKeys.add(seg.key); return; }
      tokenizeWords(seg.value).forEach(tok => {
        const lower = tok.toLowerCase();
        if (wd[lower]) seenKeys.add(lower);
      });
    });
    seenKeys.forEach(key => {
      const exposure = getCount(key);
      const boost = exposure < MASTERY_THRESHOLD ? 0.15 : -0.1;
      const prob = Math.min(1, Math.max(0, baseProb + boost));
      decisions[key] = Math.random() < prob;
    });

    const exposureDelta = {};

    function renderSpan(originalText, key, entry, isPhrase){
      exposureDelta[key] = (exposureDelta[key] || 0) + 1;
      const mastered = getVerified(key) >= MASTERY_THRESHOLD;
      const cls = "zh-word" + (isPhrase ? " zh-phrase" : "") + (mastered ? " mastered" : "");
      const displayInner = (showHanzi && entry.zh)
        ? `<ruby>${entry.zh}<rt>${entry.py}</rt></ruby>`
        : entry.py;
      return `<span class="zh-wrap"><span class="${cls}" data-original="${originalText}" data-word="${key}">${displayInner}</span><button class="zh-audio-btn" data-word="${key}" data-phrase="${isPhrase?1:0}" aria-label="Озвучить ${originalText}">🔊</button></span>`;
    }

    const html = segments.map(seg => {
      if (seg.type === "phrase") {
        if (decisions[seg.key]) return renderSpan(seg.value, seg.key, pd[seg.key], true);
        return seg.value;
      }
      return tokenizeWords(seg.value).map((tok, idx, arr) => {
        const lower = tok.toLowerCase();
        if (wd[lower] && decisions[lower]) {
          const nextWord = findNextWord(arr, idx);
          if (nextWord && EXCLUDE_PAIRS.has(lower + "|" + nextWord)) return tok;
          return renderSpan(tok, lower, wd[lower], false);
        }
        return tok;
      }).join("");
    }).join("");

    return { html, exposureDelta, replacedCount: Object.keys(exposureDelta).length };
  }

  async function onProcess(){
    const text = $("#zr-input").value.trim();
    if (!text) { $("#zr-process-msg").textContent = "Сначала вставь текст."; return; }

    const { html, exposureDelta, replacedCount } = processText(text);
    $("#zr-output").innerHTML = html;

    Object.keys(exposureDelta).forEach(w => {
      bumpExposure(w);
    });
    progress.sessions += 1;
    if (progress.sessions % LEVEL_UP_EVERY_N_SESSIONS === 0 && progress.level < 10) {
      progress.level += 1;
      $("#zr-level").value = progress.level;
      updateLevelLabel();
      $("#zr-process-msg").textContent = `Заменено: ${replacedCount}. Уровень вырос до ${progress.level} — пора чуть усложнить.`;
    } else {
      $("#zr-process-msg").textContent = replacedCount ? `Заменено уникальных слов/фраз: ${replacedCount}.` : "В этом тексте нет активных слов — отметь известные или добавь свои в списке выше (справочник большой, но по умолчанию неактивен).";
    }

    await saveProgress();
    renderStats();
    renderWordList();

    const wd = wordDict();
    const pd = phraseDict();
    $("#zr-output").querySelectorAll(".zh-word").forEach(span => {
      span.addEventListener("click", () => span.classList.toggle("revealed"));
    });
    $("#zr-output").querySelectorAll(".zh-audio-btn").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const isPhrase = btn.dataset.phrase === "1";
        const entry = isPhrase ? pd[btn.dataset.word] : wd[btn.dataset.word];
        if (entry) speakZh(entry.zh || entry.py);
      });
    });
  }

  $("#zr-process-btn").addEventListener("click", onProcess);
  $("#zr-clear-btn").addEventListener("click", () => {
    $("#zr-input").value = "";
    $("#zr-output").innerHTML = "";
    $("#zr-process-msg").textContent = "";
  });

  $("#zr-level").addEventListener("input", async () => {
    updateLevelLabel();
    progress.level = parseInt($("#zr-level").value, 10);
    await saveProgress();
    renderStats();
  });

  $("#zr-hanzi-checkbox").addEventListener("change", async () => {
    showHanzi = $("#zr-hanzi-checkbox").checked;
    try { await window.storage.set(STORAGE_KEY_SHOW_HANZI, String(showHanzi)); } catch(e) {}
    if ($("#zr-input").value.trim()) onProcess();
  });

  $("#zr-export-btn").addEventListener("click", () => {
    const payload = { customWords, customPhrases };
    $("#zr-export-output").value = JSON.stringify(payload, null, 2);
    const showing = $("#zr-export-row").style.display !== "none";
    $("#zr-export-row").style.display = showing ? "none" : "flex";
    $("#zr-export-copy-row").style.display = showing ? "none" : "flex";
  });

  $("#zr-copy-btn").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText($("#zr-export-output").value);
      $("#zr-export-msg").textContent = "Скопировано — вставь в попап расширения.";
    } catch(e) {
      $("#zr-export-output").select();
      $("#zr-export-msg").textContent = "Выдели и скопируй вручную (Ctrl/Cmd+C).";
    }
  });

  $("#zr-reset-all-btn").addEventListener("click", async () => {
    const ok = confirm("Стереть весь прогресс: свои слова, отметки «знаю», историю показов и уровень? Это необратимо.");
    if (!ok) return;
    progress = { exposures: {}, sessions: 0, level: 1 };
    customWords = {};
    customPhrases = {};
    knownWords = {};
    await saveProgress();
    await saveCustomWords();
    await saveCustomPhrases();
    await saveKnownWords();
    $("#zr-level").value = 1;
    updateLevelLabel();
    renderStats();
    renderWordList();
    $("#zr-output").innerHTML = "";
    $("#zr-process-msg").textContent = "Всё сброшено — можно начинать заново со своих слов.";
  });

  $("#zr-toggle-words").addEventListener("click", () => {
    const row = $("#zr-add-row");
    const list = $("#zr-word-list");
    const open = list.classList.toggle("open");
    row.style.display = open ? "flex" : "none";
    if (open) renderWordList();
  });

  $("#zr-toggle-known-panel").addEventListener("click", () => {
    const row = $("#zr-known-row");
    const list = $("#zr-word-list");
    const showing = row.style.display !== "none";
    row.style.display = showing ? "none" : "block";
    if (!list.classList.contains("open")) { list.classList.add("open"); renderWordList(); }
  });

  $("#zr-tone-convert-btn").addEventListener("click", () => {
    const input = $("#zr-py-input");
    input.value = convertNumberedPinyin(input.value);
  });

  $("#zr-catalog-search").addEventListener("input", () => {
    if (!$("#zr-word-list").classList.contains("open")) {
      $("#zr-word-list").classList.add("open");
      $("#zr-add-row").style.display = "flex";
    }
    renderWordList();
  });

  $("#zr-mark-known-btn").addEventListener("click", async () => {
    const raw = $("#zr-known-input").value.trim();
    const msg = $("#zr-known-msg");
    if (!raw) { msg.textContent = "Впиши хотя бы одно слово."; return; }
    const wd = wordDict();
    const pd = phraseDict();
    const entries = raw.split(/[,\n]/).map(s => s.trim().toLowerCase()).filter(Boolean);
    let matched = 0, unmatched = [];
    entries.forEach(en => {
      if (wd[en] || pd[en]) { knownWords[en] = true; matched++; }
      else unmatched.push(en);
    });
    await saveKnownWords();
    renderWordList();
    msg.textContent = unmatched.length
      ? `Отмечено ${matched}. Не нашлось в словаре: ${unmatched.join(", ")} — добавь их вручную как свои слова, если нужны.`
      : `Отмечено как известные: ${matched}.`;
    $("#zr-known-input").value = "";
  });

  $("#zr-translate-btn").addEventListener("click", () => {
    $("#zr-add-msg").textContent = "Автоперевод работает только в версии внутри Claude (нужен доступ к API) — подбери перевод там и перенеси пару сюда вручную, или впиши английское слово сам.";
  });

  $("#zr-add-btn").addEventListener("click", async () => {
    const en = $("#zr-en-input").value.trim().toLowerCase().replace(/\s+/g, " ");
    let py = $("#zr-py-input").value.trim();
    const zh = $("#zr-zh-input").value.trim();
    if (!en || !py) { $("#zr-add-msg").textContent = "Заполни хотя бы слово/фразу и pinyin."; return; }
    // safety net: if it still looks like numbered-tone pinyin (letters+digit),
    // convert automatically so forgetting to press "цифры→◌́" doesn't save raw digits
    if (/[a-zA-Züv]+[1-5]/i.test(py)) py = convertNumberedPinyin(py);
    if (en.includes(" ")) {
      customPhrases[en] = { py, zh: zh || "" };
      await saveCustomPhrases();
      $("#zr-add-msg").textContent = `Добавлена фраза: ${en} → ${py}`;
    } else {
      customWords[en] = { py, zh: zh || "" };
      await saveCustomWords();
      $("#zr-add-msg").textContent = `Добавлено слово: ${en} → ${py}`;
    }
    $("#zr-en-input").value = "";
    $("#zr-py-input").value = "";
    $("#zr-zh-input").value = "";
    renderWordList();
  });

  loadState();
})();
</script>
