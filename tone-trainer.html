<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Тон-тренажёр — Reading Bridge</title>
<style>
  :root {
    --paper: #f6f1e7; --ink: #2b2620; --ink-soft: #5c5448;
    --jade: #3c6e5e; --jade-deep: #244a3e; --rust: #a3492f;
    --line: #ddd2bd; --card-bg: #fffdf9; --pinyin-bg: #e3ece7; --phrase-bg: #f0e3d6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--paper);
    background-image: radial-gradient(ellipse at top left, rgba(60,110,94,0.07), transparent 55%), radial-gradient(ellipse at bottom right, rgba(163,73,47,0.06), transparent 55%);
    color: var(--ink); min-height: 100vh;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 20px 60px; }
  header { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; border-bottom: 1px solid var(--line); padding-bottom: 16px; margin-bottom: 22px; }
  h1 { font-family: Georgia, serif; font-size: 26px; color: var(--jade-deep); margin:0; }
  h1 .cn { color: var(--rust); font-style: italic; margin-left: 6px; }
  .subtitle { font-size: 12.5px; color: var(--ink-soft); margin-top: 4px; }

  .mode-switch { display:flex; gap:8px; margin-bottom: 18px; }
  .mode-btn { flex:1; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card-bg); cursor:pointer; font-size:13px; font-weight:600; color: var(--ink-soft); }
  .mode-btn.active { background: var(--jade-deep); color: var(--paper); border-color: var(--jade-deep); }

  .stats-row { display:flex; gap: 14px; margin-bottom: 16px; }
  .stat-box { flex:1; background: var(--card-bg); border:1px solid var(--line); border-radius:8px; padding: 10px; text-align:center; }
  .stat-box b { display:block; font-size:20px; color: var(--jade-deep); }
  .stat-box span { font-size: 10px; text-transform:uppercase; color: var(--ink-soft); letter-spacing:.05em; }

  .card { background: var(--card-bg); border: 1px solid var(--line); border-radius: 12px; padding: 30px 24px; text-align:center; margin-bottom: 16px; }
  .audio-btn { background: var(--jade-deep); color: var(--paper); border:none; border-radius: 24px; padding: 14px 28px; font-size: 16px; cursor:pointer; margin-bottom: 22px; }
  .audio-btn:hover { background: var(--jade); }
  .replay-hint { font-size: 11.5px; color: var(--ink-soft); margin-bottom: 22px; margin-top:-14px; }

  .tone-options { display:grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .tone-btn { padding: 16px 6px; border-radius: 10px; border: 1px solid var(--line); background: #fffefb; cursor:pointer; font-size: 22px; font-weight:700; color: var(--jade-deep); }
  .tone-btn:hover { background: var(--pinyin-bg); }
  .tone-btn .num { display:block; font-size: 11px; color: var(--ink-soft); margin-top: 4px; font-weight:600; }

  .meaning-options { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .meaning-btn { padding: 14px 10px; border-radius: 8px; border: 1px solid var(--line); background: #fffefb; cursor:pointer; font-size: 14px; color: var(--ink); }
  .meaning-btn:hover { background: var(--pinyin-bg); }

  .feedback { min-height: 60px; margin-top: 18px; }
  .feedback.correct { color: var(--jade-deep); }
  .feedback.wrong { color: var(--rust); }
  .feedback .answer { font-size: 22px; font-weight:700; margin: 6px 0; }
  .feedback .answer.phrase-style { color: var(--rust); }
  .next-btn { margin-top: 10px; padding: 8px 20px; border-radius: 6px; border: 1px solid var(--jade-deep); background: var(--jade-deep); color: var(--paper); cursor:pointer; font-size: 13px; font-weight:600; }
  .next-btn:hover { background: var(--jade); }

  .empty { text-align:center; padding: 30px; color: var(--ink-soft); font-size: 13px; }
  .footer-link { text-align:center; margin-top: 20px; font-size:12px; }
  .footer-link a { color: var(--jade-deep); }
</style>
</head>

<div style="max-width:720px;margin:0 auto;padding:14px 20px 0;">
  <a href="index.html" style="font-size:12.5px;color:#3c6e5e;text-decoration:none;">← Назад ко всем инструментам</a>
  <a href="dictionary.html" style="font-size:12.5px;color:#a3492f;text-decoration:none;margin-left:16px;font-weight:600;">📚 Открыть словарь</a>

<div class="wrap">
  <header>
    <div>
      <h1>Тон-тренажёр<span class="cn">听力练习</span></h1>
      <div class="subtitle">Слушаешь — угадываешь. Работает по тому же словарю, что и Reading Bridge.</div>
    </div>
  </header>

  <div class="mode-switch">
    <button class="mode-btn active" id="mode-tone">Определи тон</button>
    <button class="mode-btn" id="mode-meaning">Определи значение</button>
  </div>

  <div class="stats-row">
    <div class="stat-box"><b id="stat-correct">0</b><span>верно</span></div>
    <div class="stat-box"><b id="stat-total">0</b><span>всего</span></div>
    <div class="stat-box"><b id="stat-streak">0</b><span>подряд</span></div>
    <div class="stat-box"><b id="stat-best">0</b><span>рекорд</span></div>
  </div>

  <div id="game-area"></div>

  <div class="footer-link">Верные ответы засчитываются в прогресс Reading Bridge того же браузера.</div>
</div>

    "come up with":{py:"xiǎngchū",zh:"想出"}, "take care of":{py:"zhàogù",zh:"照顾"}, "show up":{py:"chūxiàn",zh:"出现"},
    "hang out":{py:"xiánguàng",zh:"闲逛"}, "break up":{py:"fēnshǒu",zh:"分手"}, "calm down":{py:"lěngjìng",zh:"冷静"},
    "wake up":{py:"xǐng",zh:"醒"}, "turn on":{py:"dǎkāi",zh:"打开"}, "turn off":{py:"guāndiào",zh:"关掉"},
    "deal with":{py:"chǔlǐ",zh:"处理"}, "of course":{py:"dāngrán",zh:"当然"}, "by the way":{py:"shùnbiàn shuō",zh:"顺便说"},
    "in fact":{py:"qíshí",zh:"其实"}, "at least":{py:"zhìshǎo",zh:"至少"}
  };

  const STORAGE_PROGRESS = "zh-reader-progress";
  const STORAGE_CUSTOM_WORDS = "zh-reader-custom-words";
  const STORAGE_CUSTOM_PHRASES = "zh-reader-custom-phrases";
  const STATS_KEY = "zh-tone-trainer-stats";

  const TONE_MAP = {
    "ā":1,"á":2,"ǎ":3,"à":4, "ē":1,"é":2,"ě":3,"è":4, "ī":1,"í":2,"ǐ":3,"ì":4,
    "ō":1,"ó":2,"ǒ":3,"ò":4, "ū":1,"ú":2,"ǔ":3,"ù":4, "ǖ":1,"ǘ":2,"ǚ":3,"ǜ":4
  };
  const TONE_SYMBOLS = { 1: "ˉ", 2: "ˊ", 3: "ˇ", 4: "ˋ" };

  let zhVoice = null;
  function pickVoice(){
    if (!window.speechSynthesis) return;
    const voices = speechSynthesis.getVoices();
    zhVoice = voices.find(v => v.lang === "zh-CN") || voices.find(v => v.lang && v.lang.startsWith("zh")) || null;
  }
  if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function speakZh(text){
    if (!window.speechSynthesis || !text) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-CN"; if (zhVoice) u.voice = zhVoice; u.rate = 0.8;
    speechSynthesis.speak(u);
  }

  function extractTones(py){
    const tones = [];
    for (const ch of py) { if (TONE_MAP[ch]) tones.push(TONE_MAP[ch]); }
    return tones;
  }

  function loadDict(){
    let customWords = {}, customPhrases = {};
    try { customWords = JSON.parse(localStorage.getItem(STORAGE_CUSTOM_WORDS) || "{}"); } catch(e){}
    try { customPhrases = JSON.parse(localStorage.getItem(STORAGE_CUSTOM_PHRASES) || "{}"); } catch(e){}
    const words = Object.assign({}, BUILTIN_WORDS, customWords);
    const phrases = Object.assign({}, BUILTIN_PHRASES, customPhrases);
    return { words, phrases };
  }

  function loadProgress(){
    try {
      const raw = localStorage.getItem(STORAGE_PROGRESS);
      if (raw) return JSON.parse(raw);
    } catch(e){}
    return { exposures: {}, sessions: 0, level: 1 };
  }
  function saveProgress(p){
    try { localStorage.setItem(STORAGE_PROGRESS, JSON.stringify(p)); } catch(e){}
  }
  function bumpProgressExposure(key){
    const progress = loadProgress();
    const e = progress.exposures[key];
    const count = e ? (typeof e === "number" ? e : (e.count || 0)) : 0;
    const verified = e ? (typeof e === "number" ? 0 : (e.verified || 0)) : 0;
    // a correct answer here is an active recall test, not passive reading —
    // it counts toward "verified" (real mastery), same as dashboard review.
    progress.exposures[key] = { count: count + 1, verified: verified + 1, lastSeen: Date.now() };
    saveProgress(progress);
  }

  function loadStats(){
    try {
      const raw = localStorage.getItem(STATS_KEY);
      if (raw) return JSON.parse(raw);
    } catch(e){}
    return {
      tone: { correct: 0, total: 0, streak: 0, best: 0 },
      meaning: { correct: 0, total: 0, streak: 0, best: 0 }
    };
  }
  function saveStats(s){ try { localStorage.setItem(STATS_KEY, JSON.stringify(s)); } catch(e){} }

  let stats = loadStats();
  let mode = "tone";
  let current = null;

  function renderStats(){
    const s = stats[mode];
    document.getElementById("stat-correct").textContent = s.correct;
    document.getElementById("stat-total").textContent = s.total;
    document.getElementById("stat-streak").textContent = s.streak;
    document.getElementById("stat-best").textContent = s.best;
  }

  function pickRandom(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

  function encounteredKeys(){
    const progress = loadProgress();
    const exposures = progress.exposures || {};
    return new Set(Object.keys(exposures).filter(k => {
      const e = exposures[k];
      const count = typeof e === "number" ? e : (e && e.count) || 0;
      return count > 0;
    }));
  }

  function buildToneRound(){
    const { words } = loadDict();
    const encountered = encounteredKeys();
    const pool = Object.keys(words)
      .filter(en => encountered.has(en))
      .map(en => ({ en, entry: words[en], tones: extractTones(words[en].py) }))
      .filter(w => w.tones.length === 1);
    if (!pool.length) return null;
    return pickRandom(pool);
  }

  function buildMeaningRound(){
    const { words, phrases } = loadDict();
    const encountered = encounteredKeys();
    const all = [
      ...Object.keys(words).map(en => ({ en, entry: words[en], key: en })),
      ...Object.keys(phrases).map(en => ({ en, entry: phrases[en], key: en }))
    ];
    // only test on words/phrases you've actually seen in Reading Bridge —
    // testing on ones you've never encountered is just blind guessing.
    const seenPool = all.filter(e => encountered.has(e.en));
    if (seenPool.length < 1) return null;
    const correct = pickRandom(seenPool);
    // distractors: prefer other encountered words too, fall back to the
    // wider dictionary only if you don't have enough seen words yet
    const distractors = [];
    const triedFrom = seenPool.length > 4 ? seenPool : all;
    let attempts = 0;
    while (distractors.length < 3 && attempts < 200) {
      attempts++;
      const cand = pickRandom(triedFrom);
      if (cand.en !== correct.en && !distractors.find(d => d.en === cand.en)) distractors.push(cand);
    }
    if (distractors.length < 3) return null; // not enough vocabulary yet
    const options = [correct, ...distractors].sort(() => Math.random() - 0.5);
    return { correct, options };
  }

  function renderGame(){
    const area = document.getElementById("game-area");

    if (mode === "tone") {
      current = buildToneRound();
      if (!current) {
        area.innerHTML = `<div class="empty">Пока нет односложных слов, которые ты уже встречал в Reading Bridge — почитай что-нибудь там сначала, потом возвращайся сюда практиковать тоны.</div>`;
        return;
      }
      area.innerHTML = `
        <div class="card">
          <button class="audio-btn" id="play-btn">🔊 Слушать</button>
          <div class="replay-hint">Нажми ещё раз, если не расслышал</div>
          <div class="tone-options">
            <button class="tone-btn" data-tone="1">${TONE_SYMBOLS[1]}<span class="num">1-й тон</span></button>
            <button class="tone-btn" data-tone="2">${TONE_SYMBOLS[2]}<span class="num">2-й тон</span></button>
            <button class="tone-btn" data-tone="3">${TONE_SYMBOLS[3]}<span class="num">3-й тон</span></button>
            <button class="tone-btn" data-tone="4">${TONE_SYMBOLS[4]}<span class="num">4-й тон</span></button>
          </div>
          <div class="feedback" id="feedback"></div>
        </div>`;
      document.getElementById("play-btn").addEventListener("click", () => speakZh(current.entry.zh || current.entry.py));
      speakZh(current.entry.zh || current.entry.py);
      area.querySelectorAll(".tone-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const picked = parseInt(btn.dataset.tone, 10);
          const isCorrect = picked === current.tones[0];
          handleAnswer(isCorrect, current.en, `${current.entry.py} — ${current.en}`, current.entry.zh, false);
        });
      });
    } else {
      current = buildMeaningRound();
      if (!current) {
        area.innerHTML = `<div class="empty">Пока мало слов, которые ты уже встречал в Reading Bridge (нужно хотя бы 4) — почитай что-нибудь там, встреченные слова появятся тут для практики.</div>`;
        return;
      }
      area.innerHTML = `
        <div class="card">
          <button class="audio-btn" id="play-btn">🔊 Слушать</button>
          <div class="replay-hint">Нажми ещё раз, если не расслышал</div>
          <div class="meaning-options">
            ${current.options.map(o => `<button class="meaning-btn" data-en="${o.en}">${o.en}</button>`).join("")}
          </div>
          <div class="feedback" id="feedback"></div>
        </div>`;
      document.getElementById("play-btn").addEventListener("click", () => speakZh(current.correct.entry.zh || current.correct.entry.py));
      speakZh(current.correct.entry.zh || current.correct.entry.py);
      area.querySelectorAll(".meaning-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const isCorrect = btn.dataset.en === current.correct.en;
          const isPhrase = current.correct.entry.zh && Object.keys(BUILTIN_PHRASES).concat(Object.keys(JSON.parse(localStorage.getItem(STORAGE_CUSTOM_PHRASES) || "{}"))).includes(current.correct.en);
          handleAnswer(isCorrect, current.correct.en, `${current.correct.entry.py} — ${current.correct.en}`, current.correct.entry.zh, isPhrase);
        });
      });
    }
  }

  function handleAnswer(isCorrect, key, answerText, zh, isPhrase){
    const s = stats[mode];
    s.total += 1;
    if (isCorrect) {
      s.correct += 1; s.streak += 1; s.best = Math.max(s.best, s.streak);
      bumpProgressExposure(key);
    } else {
      s.streak = 0;
    }
    saveStats(stats);
    renderStats();

    const fb = document.getElementById("feedback");
    fb.className = "feedback " + (isCorrect ? "correct" : "wrong");
    fb.innerHTML = `
      <div>${isCorrect ? "Верно!" : "Не совсем"}</div>
      <div class="answer ${isPhrase ? 'phrase-style' : ''}">${answerText}</div>
      <button class="next-btn" id="next-btn">Дальше →</button>
    `;
    document.getElementById("next-btn").addEventListener("click", renderGame);
    area_disable();
  }

  function area_disable(){
    document.querySelectorAll(".tone-btn, .meaning-btn").forEach(b => b.disabled = true);
  }

  document.getElementById("mode-tone").addEventListener("click", () => {
    mode = "tone";
    document.getElementById("mode-tone").classList.add("active");
    document.getElementById("mode-meaning").classList.remove("active");
    renderStats(); renderGame();
  });
  document.getElementById("mode-meaning").addEventListener("click", () => {
    mode = "meaning";
    document.getElementById("mode-meaning").classList.add("active");
    document.getElementById("mode-tone").classList.remove("active");
    renderStats(); renderGame();
  });

  renderStats();
  renderGame();
})();
</script>
</body>
</html>
